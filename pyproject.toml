[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "local-pii-guard"
version = "0.1.0"
description = "Local-first privacy gateway for LLM apps and AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["privacy", "pii", "llm", "ai-agents", "dlp", "local-first", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "faker>=19.0.0",
]

[project.optional-dependencies]
llm = [
    "llama-cpp-python>=0.2.0",
]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/LITVA-HUB/Local-PII-Guard"
Repository = "https://github.com/LITVA-HUB/Local-PII-Guard"
Issues = "https://github.com/LITVA-HUB/Local-PII-Guard/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pii_*"]

[tool.mypy]
python_version = "3.9"
strict = false
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
